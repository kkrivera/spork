name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn build

      - run: yarn lint

      - run: yarn test

      - name: readme-sync check
        run: yarn readme-sync:check --base "origin/${{ github.event.pull_request.base.ref || 'main' }}"
