name: Release — bump version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # Pushes made with the default GITHUB_TOKEN never trigger other
      # workflows, so the tag push below would silently skip
      # release-build.yml. A GitHub App token doesn't have that limit — see
      # docs/RELEASING.md for the app's one-time setup.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable

      - run: yarn install --immutable

      - id: bump
        run: echo "version=$(yarn release:bump --bump ${{ inputs.bump }})" >> "$GITHUB_OUTPUT"

      # Sanity check: the version literals bump-version.ts patched into
      # packages/cli and packages/mcp must still compile.
      - run: yarn build

      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(release): bump version to v${{ steps.bump.outputs.version }}"
          git tag -a "v${{ steps.bump.outputs.version }}" -m "v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.version }}"
