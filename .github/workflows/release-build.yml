name: Release — build binaries

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Builds both macOS targets (arm64 natively, x64 by downloading and
  # injecting the official darwin-x64 node build — verified for real that
  # an ad-hoc-signed cross-arch binary runs fine via Rosetta) on one
  # Apple-Silicon runner, then signs all four. No x64 Mac runner needed at
  # all anymore — see docs/plans/0002-binary-releases.md.
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn build

      - run: yarn package:mac

      - name: Sign macOS binaries
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          for arch_dir in darwin-arm64 darwin-x64; do
            ./tools/package-binary/macos-sign.sh "dist-sea/$arch_dir/spork"
            ./tools/package-binary/macos-sign.sh "dist-sea/$arch_dir/spork-mcp"
          done

      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C dist-sea/darwin-arm64 -czf "spork-${version}-darwin-arm64.tar.gz" spork
          tar -C dist-sea/darwin-arm64 -czf "spork-mcp-${version}-darwin-arm64.tar.gz" spork-mcp
          tar -C dist-sea/darwin-x64 -czf "spork-${version}-darwin-x64.tar.gz" spork
          tar -C dist-sea/darwin-x64 -czf "spork-mcp-${version}-darwin-x64.tar.gz" spork-mcp

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin
          path: '*.tar.gz'

  # Builds both linux-x64 (native) and win32-x64 (downloaded + injected,
  # structurally verified — not executed, no Windows/Wine available where
  # this was tested) on one runner. No signing: neither target needs it.
  build-other:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn build

      - run: yarn package:linux

      - run: yarn package:win

      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          tar -C dist-sea/linux-x64 -czf "spork-${version}-linux-x64.tar.gz" spork
          tar -C dist-sea/linux-x64 -czf "spork-mcp-${version}-linux-x64.tar.gz" spork-mcp
          (cd dist-sea/win32-x64 && zip -q "$OLDPWD/spork-${version}-win32-x64.zip" spork.exe)
          (cd dist-sea/win32-x64 && zip -q "$OLDPWD/spork-mcp-${version}-win32-x64.zip" spork-mcp.exe)

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-other
          path: |
            *.tar.gz
            *.zip

  release:
    needs: [build-mac, build-other]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable

      - run: yarn install --immutable

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: gh release create "${{ github.ref_name }}" artifacts/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # Keeps Formula/spork.rb (see tools/homebrew-formula) pointed at this
      # release's spork archives — never hand-edited, always regenerated.
      - name: Update Homebrew formula
        run: yarn homebrew:update-formula --version "${GITHUB_REF_NAME#v}" --artifacts-dir artifacts

      - name: Commit updated formula
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/spork.rb
          if git diff --cached --quiet; then
            echo "Formula/spork.rb already up to date."
          else
            git commit -m "chore(homebrew): update formula to ${GITHUB_REF_NAME}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
